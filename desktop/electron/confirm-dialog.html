<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; background: #fff; color: #26334a; user-select: none; }
    .wrap { height: 100vh; display: flex; flex-direction: column; padding: 18px 20px 16px; }
    h3 { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
    p { flex: 1; font-size: 13px; line-height: 1.6; color: #5b6b7a; white-space: pre-line; overflow: auto; }
    .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    button { min-height: 34px; padding: 0 18px; border-radius: 8px; border: 1px solid #d5e1ec; background: #fff; color: #4e6480; font-size: 13px; cursor: pointer; }
    button:hover { border-color: #a9c6ff; background: #f7faff; }
    #ok { border-color: transparent; color: #fff; background: #e24b4a; }
    #ok:hover { background: #c93c3b; border-color: transparent; }
  </style>
</head>
<body>
  <div class="wrap">
    <h3>确认操作</h3>
    <p id="msg"></p>
    <div class="btns">
      <button id="cancel" type="button">取消</button>
      <button id="ok" type="button">确定</button>
    </div>
  </div>
  <script>
    var payload = decodeURIComponent(location.hash.slice(1) || '');
    document.getElementById('msg').textContent = payload;
    document.getElementById('ok').onclick = function () { window.confirmBridge.done(true); };
    document.getElementById('cancel').onclick = function () { window.confirmBridge.done(false); };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.confirmBridge.done(false); });
  </script>
</body>
</html>
